<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — tackworks.net</title>
<style>
  :root {
    --bg: #0d1117;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #53c9b1;
    --font: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    text-align: center;
  }
  .code { font-size: 48px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .msg { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; }
  a { color: var(--accent); text-decoration: none; font-size: 13px; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div>
  <div class="code">404</div>
  <div class="msg">Nothing here. The signal got lost.</div>
  <a href="/">Back to tackworks.net</a>
</div>
</body>
</html>
